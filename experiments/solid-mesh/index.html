<!doctype html>
<html lang="sv">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>LiraIFC · lokalt solidprov</title>
  <style>
    body {
      margin: 0;
      font: 15px system-ui;
      color: #d5e4e7;
      background: #183038;
    }
    header {
      padding: 16px;
      display: flex;
      gap: 18px;
      align-items: center;
    }
    button,
    input {
      font: inherit;
    }
    button {
      padding: 9px 14px;
      background: #247d68;
      color: white;
      border: 0;
      border-radius: 6px;
    }
    #status {
      padding: 0 16px;
    }
    canvas {
      display: block;
    }
    pre {
      max-height: 180px;
      overflow: auto;
      margin: 12px 16px;
      font-size: 12px;
    }
    small {
      color: #a8bfc5;
    }
  </style>
  <header>
    <b>LiraIFC · 3DSOLID-prov</b
    ><button id="fixture">Testa genererad DWG</button
    ><input id="file" type="file" accept=".dwg" /><small
      >Separat lokalt experiment · ingen uppladdning</small
    >
  </header>
  <div id="status">Välj en DWG eller kör testfilen.</div>
  <pre id="report"></pre>
  <div id="view"></div>
  <script type="module" src="./probe.js"></script>
</html>
