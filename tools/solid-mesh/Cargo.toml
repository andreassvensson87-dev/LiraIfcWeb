[package]
name = "lira-solid-mesh-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
fixtures = []

[dependencies]
codec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "d36331d" }
kernel = { package = "opencadkernel", git = "https://github.com/HakanSeven12/opencadkernel.git", rev = "60f086bd6200924f9f96f31de4722d1216bb29b9", features = ["acis"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
